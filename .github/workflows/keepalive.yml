name: Keep Render Services Alive
on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping wechatbot API
        run: curl -s -o /dev/null -w "%{http_code}" https://wechatbot-g6ez.onrender.com/api/health
      - name: Ping PDF converter
        run: curl -s -o /dev/null -w "%{http_code}" https://pdf-converter-idfi.onrender.com/
