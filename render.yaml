services:
  - type: web
    name: wechatbot-api
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: WECHAT_APP_ID
        value: "wx2510f82943d7741e"
      - key: WECHAT_APP_SECRET
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: PDF_SERVICE_URL
        sync: false

  - type: web
    name: wechatbot-pdf01
    runtime: docker
    rootDir: pdf-service
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

  - type: web
    name: wechatbot-pdf02
    runtime: docker
    rootDir: pdf-service
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
