services:
  - type: web
    name: wechatbot-api
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: WECHAT_APP_ID
        value: "wx2510f82943d7741e"
      - key: WECHAT_APP_SECRET
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: PDF_SERVICE_URL
        value: "https://pdf-converter-idfi.onrender.com"

  - type: web
    name: pdf-converter
    runtime: python
    rootDir: pdf-service
    buildCommand: |
      apt-get update && apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress fonts-noto-cjk 2>/dev/null || \
      (apt-get update && apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui fonts-noto-cjk 2>/dev/null) || \
      echo "WARNING: LibreOffice install failed, DOCX->PDF will use fallback"
      pip install -r requirements.txt
    startCommand: |
      which libreoffice || which soffice || echo "LibreOffice not found in PATH"
      python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
