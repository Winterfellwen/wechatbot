services:
  - type: web
    name: wechatbot-api
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3307"
      - key: MYSQL_USER
        value: "admin"
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: "wechatbot"
      - key: MYSQL_SSL
        value: "true"
      - key: WECHAT_APP_ID
        value: "wx2510f82943d7741e"
      - key: WECHAT_APP_SECRET
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: PDF_SERVICE_URLS
        sync: false
      - key: PDF_SERVICE_API_KEY
        sync: false
      - key: TTS_API_AZURE
        sync: false
