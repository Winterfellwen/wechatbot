services:
  - type: web
    name: wechatbot-api
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MYSQL_HOST
        sync: false  # 在 Render Dashboard 设为 wechatbot-mysql-wechatbot.g.aivencloud.com
      - key: MYSQL_PORT
        value: "16817"
      - key: MYSQL_USER
        value: "avnadmin"
      - key: MYSQL_PASSWORD
        sync: false  # 实际密码在 Render Dashboard 设为环境变量
      - key: MYSQL_DATABASE
        value: "defaultdb"
      - key: MYSQL_SSL
        value: "true"
      - key: WECHAT_APP_ID
        value: "wx2510f82943d7741e"
      - key: WECHAT_APP_SECRET
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: PDF_SERVICE_URLS
        sync: false
      - key: PDF_SERVICE_API_KEY
        sync: false
      - key: TTS_API_AZURE
        sync: false
