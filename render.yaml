services:
  # Frontend Web Service
  - type: web
    name: multicloud-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web.render
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://multicloud-api.onrender.com
      - key: NODE_ENV
        value: production

  # Backend API Service
  - type: web
    name: multicloud-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api.render
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8765"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VAULT_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://multicloud-web.onrender.com

  # Background Worker
  - type: worker
    name: multicloud-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker.render
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
