services:
  - type: web
    name: wechatbot-api
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: WECHAT_APP_ID
        value: "wx2510f82943d7741e"
      - key: WECHAT_APP_SECRET
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: PDF_SERVICE_URL
        value: "https://pdf-converter-idfi.onrender.com"

  - type: web
    name: pdf-converter
    runtime: python
    rootDir: pdf-service
    buildCommand: |
      # Install WeasyPrint system dependencies (Cairo, Pango, etc.)
      apt-get update && apt-get install -y --no-install-recommends \
        libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libffi-dev \
        shared-mime-info gdk-pixbuf-2.0 2>/dev/null || true
      # Install LibreOffice (optional, for best DOCX fidelity)
      apt-get install -y --no-install-recommends \
        libreoffice-writer-nogui fonts-noto-cjk 2>/dev/null || \
        echo "WARNING: LibreOffice install failed"
      pip install -r requirements.txt
    startCommand: |
      which libreoffice || which soffice || echo "LibreOffice not found in PATH"
      python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
