services:
  - type: web
    name: pdf-converter
    runtime: python
    buildCommand: |
      apt-get update && apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
